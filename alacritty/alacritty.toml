# Alacritty config — https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true

[window]
padding = { x = 16, y = 14 }
decorations = "Buttonless" # hidden title bar/buttons, keeps macOS rounded corners
opacity = 0.85             # background transparency (1.0 = opaque)
blur = true                # blur what's behind the window

[scrolling]
history = 100000

[font]
size = 14.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }

[cursor]
style = { shape = "Block", blinking = "Off" }

# Shift+Enter sends ESC+CR (newline without submit in TUI apps)
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Monochrome: black/white/grays, with muted hints so errors and diffs stay readable.
[colors.primary]
background = "#000000"
foreground = "#e8e8e8"

[colors.cursor]
text = "#000000"
cursor = "#e8e8e8"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#e8e8e8"

[colors.selection]
text = "#ffffff"
background = "#3a3a3a"

[colors.normal]
black = "#262626"
red = "#c27d7d"
green = "#8fa38f"
yellow = "#c2b48f"
blue = "#8f9fb3"
magenta = "#a99ab3"
cyan = "#8fadad"
white = "#d0d0d0"

[colors.bright]
black = "#6b6b6b"
red = "#d49494"
green = "#a8bca8"
yellow = "#d6c9a6"
blue = "#a8b6c7"
magenta = "#bfb1c7"
cyan = "#a8c4c4"
white = "#ffffff"
